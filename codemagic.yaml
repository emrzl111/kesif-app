# Codemagic CI/CD - Keşif iOS derlemesi
# Gerekli Codemagic ayarları:
#   1. Teams > Integrations > App Store Connect: "Kesif ASC Key" adında API anahtarı
#   2. Environment variables > "supabase" grubu: SUPABASE_URL, SUPABASE_ANON_KEY (Secure işaretli)

workflows:
  # Apple hesabı gerektirmez: sadece kodun iOS'ta derlendiğini doğrular
  ios-test:
    name: iOS Test (imzasız)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - supabase
      flutter: 3.44.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter paketleri
        script: flutter pub get
      - name: CocoaPods kurulumu
        script: cd ios && pod install --repo-update
      - name: iOS derle (simulator, imza gerektirmez)
        script: |
          flutter build ios --simulator --debug \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/ios/iphonesimulator/*.app

  ios-release:
    name: iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Kesif ASC Key
    environment:
      groups:
        - supabase
        - apple
      vars:
        BUNDLE_ID: com.kesif.kesifApp
      flutter: 3.44.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter paketleri
        script: flutter pub get
      - name: CocoaPods kurulumu
        script: cd ios && pod install --repo-update
      - name: Keychain hazırla
        script: keychain initialize
      - name: İmzalama dosyalarını al / oluştur
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Sertifikaları ekle
        script: keychain add-certificates
      - name: İmzalama profillerini uygula
        script: xcode-project use-profiles
      - name: IPA derle
        script: |
          flutter build ipa --release \
            --build-number=$((100 + BUILD_NUMBER)) \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
